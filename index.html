<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Survey Telecom Pro</title>
    <meta name="description" content="Dashboard integral de gestión e inspección de Site Survey telecomunicaciones con generación de reportes PDF oficiales y análisis de infraestructura." />
    <meta property="og:title" content="Site Survey Telecom Pro" />
    <meta property="og:description" content="Dashboard integral de gestión e inspección de Site Survey telecomunicaciones con generación de reportes PDF oficiales y análisis de infraestructura." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root">
      <div id="telecom-initial-loader" style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:48px;height:48px;border-radius:12px;background:#0284c7;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(2,132,199,0.4);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg>
        </div>
        <h1 style="font-size:18px;font-weight:700;margin:0 0 8px 0;letter-spacing:-0.02em;">Site Survey Telecom Pro</h1>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 20px 0;max-width:320px;">Cargando estación base, planos y reportes técnicos...</p>
        <div style="width:36px;height:36px;border:3px solid #1e293b;border-top-color:#38bdf8;border-radius:50%;animation:telecom-spin 0.8s linear infinite;"></div>

        <!-- Runtime diagnostic container shown on script error or timeout -->
        <div id="telecom-error-box" style="display:none;margin-top:24px;max-width:380px;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:16px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.5);">
          <div id="telecom-error-title" style="font-size:13px;font-weight:700;color:#f87171;margin-bottom:6px;">Tiempo de espera agotado</div>
          <div id="telecom-error-msg" style="font-size:11px;color:#94a3b8;margin-bottom:12px;line-height:1.4;">
            El navegador tardó más de lo previsto en inicializar la aplicación o los datos locales tienen un formato incompatible.
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button onclick="try{localStorage.removeItem('site_survey_telecom_data_v1');}catch(e){}location.reload();" style="width:100%;padding:8px 12px;background:#0284c7;color:#ffffff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">
              Restablecer datos y Recargar
            </button>
            <button onclick="location.reload();" style="width:100%;padding:7px 12px;background:#1e293b;color:#cbd5e1;border:none;border-radius:8px;font-size:11px;cursor:pointer;">
              Reintentar
            </button>
          </div>
        </div>

        <noscript>
          <p style="color:#f87171;margin-top:20px;font-size:13px;">Se requiere habilitar JavaScript para utilizar esta aplicación.</p>
        </noscript>
      </div>
      <style>
        @keyframes telecom-spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <script>
      window.__app_mounted = false;
      function showDiagnostic(title, msg) {
        var box = document.getElementById('telecom-error-box');
        if (box) {
          box.style.display = 'block';
          if (title) document.getElementById('telecom-error-title').textContent = title;
          if (msg) document.getElementById('telecom-error-msg').textContent = msg;
        }
      }
      window.addEventListener('error', function(e) {
        if (!window.__app_mounted) {
          var details = (e.error && (e.error.message || e.error.stack)) || e.message || 'Error en script principal';
          console.error('Captured window error:', details);
          showDiagnostic('Error al cargar la aplicación', details);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (!window.__app_mounted) {
          var details = (e.reason && (e.reason.message || String(e.reason))) || 'Promesa rechazada';
          console.error('Captured rejection:', details);
          showDiagnostic('Error en promesa de inicialización', details);
        }
      });
      setTimeout(function() {
        if (!window.__app_mounted) {
          showDiagnostic('Carga demorada detectada', 'La inicialización tomó más de 3.5 segundos. Haga clic abajo para restablecer la sesión.');
        }
      }, 3500);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
