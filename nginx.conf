# Configuración de Nginx para Site Survey Telecom Pro
# Ubicación típica: /etc/nginx/sites-available/site-survey.conf

server {
    listen 80;
    server_name _; # Reemplazar por su dominio o IP del servidor

    # Compresión Gzip para alto rendimiento en redes móviles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Límite de carga para planos y fotografías de campo
    client_max_body_size 25M;

    # Opción 1: Proxy inverso hacia el servidor Node.js (Recomendado para full-stack y Gemini AI)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Caché optimizada para activos estáticos precompilados
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Opción 2 (Servidor puramente estático sin Node):
    # Descomente las siguientes líneas si solo aloja la carpeta /dist
    # root /var/www/site-survey/dist;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}
